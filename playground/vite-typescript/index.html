<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Quran View - Web Component</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls label {
            font-weight: 500;
        }

        .controls select,
        .controls button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .controls button {
            background: #667eea;
            color: white;
            border: none;
        }

        .controls button:hover {
            background: #5a6fd6;
        }

        #word-info {
            padding: 12px 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            min-width: 300px;
            text-align: center;
        }

        #word-info:empty {
            display: none;
        }

        open-quran-view {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        .tafseer-dialog {
            border: none;
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.8);
            color: #1a1a2e;
            margin: auto;
        }

        .tafseer-dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        .tafseer-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .tafseer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .tafseer-surah,
        .tafseer-verse {
            font-weight: 600;
            font-size: 14px;
            color: #6366f1;
            flex: 1;
        }

        .tafseer-surah {
            text-align: left;
        }

        .tafseer-verse {
            text-align: right;
        }

        .tafseer-position {
            font-weight: 600;
            font-size: 14px;
            color: #6366f1;
            text-align: center;
        }

        .tafseer-word {
            font-size: 24px;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-family: "DigitalKhatt", "Scheherazade New", "Amiri", system-ui, sans-serif;
        }

        .tafseer-text {
            font-size: 16px;
            line-height: 1.8;
            text-align: right;
            overflow-y: auto;
        }

        .tafseer-actions {
            display: flex;
            justify-content: center;
            margin-top: 8px;
        }

        .tafseer-close {
            padding: 10px 32px;
            border: none;
            border-radius: 12px;
            background: #1a1a1a;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tafseer-close:hover {
            background: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Open Quran View - Web Component Demo</h1>

        <div class="controls">
            <label>
                Page:
                <input type="number" id="page-input" min="1" max="604" value="1" style="width: 60px; padding: 6px;">
            </label>
            <label>
                Theme:
                <select id="theme-select">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </label>
            <label>
                Layout:
                <select id="mushaf-select">
                    <option value="hafs-v2">Hafs (QCF V2)</option>
                    <option value="hafs-v4">Hafs (QCF V4)</option>
                    <option value="hafs-unicode">Hafs Unicode</option>
                </select>
            </label>
            <button id="go-btn">Go</button>
            <button id="prev-btn">Previous</button>
            <button id="next-btn">Next</button>
        </div>

        <div id="word-info">Click on a word to see details</div>

        <open-quran-view id="quran-viewer" page="1" mushaf-layout="hafs-v2" width="600" height="850" theme="light">
        </open-quran-view>

        <dialog id="tafseer-dialog" class="tafseer-dialog">
            <div class="tafseer-content" id="tafseer-content"></div>
        </dialog>
    </div>

    <script type="module" src="/main.ts"></script>
</body>

</html>
